# Runs scripts/check --all, the same gate as Claude's sessions and the pre-commit hook.
# The GitHub App cannot push under .github/workflows/, so a person edits this file by hand.
name: ci

on:
  push:
  pull_request:
  # Weekly, against the latest Claude Code: a new CLI release that breaks the plugin shows
  # up here, while pushes keep the pinned version and stay green.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # validate needs no login. Pushes use a pinned CLI so a new release cannot turn CI red
      # on its own; bump it on purpose. The weekly and manual runs use the latest: when one
      # fails and pushes pass, the new release broke something, so fix the plugin, then bump
      # the pin.
      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'latest' || '2.1.312' }}
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - run: scripts/check --all
