# Fast checks run on each file Claude edits. Read by the yotamake plugin's post-edit-check.sh hook.
#
# Format: <glob> <command>
#   - The glob is matched against the full path. The first matching line wins.
#   - {file} in the command is replaced with the edited file's path (shell-quoted).
#   - The command runs from the repository root. Keep it fast: it runs on every edit.
#   - A non-zero exit shows the output to Claude.
#
# All lines are commented out. Uncomment or add the ones that fit the project.

*.sh    bash -n {file}
*.mjs   node --check {file}

# *.ts    pnpm exec eslint --max-warnings 0 {file}
