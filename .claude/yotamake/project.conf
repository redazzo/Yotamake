# Project facts the yotamake hooks and scripts/check read, so they need not parse
# CLAUDE.md (ADR-0008). CLAUDE.md stays the source: when you change its "Main branch"
# or "Docs-only" line, change the matching lines here. /yotamake:doctor checks they agree.
#
# One "key value" pair per line; # starts a comment.
#   main-branch <name>   the "Main branch" line. Once.
#   docs <glob>          a file that counts as a doc (the "Docs-only" line), matched
#                        against its path from the repository root. A glob with no /
#                        matches only files at the root. Lines starting with ! are
#                        exceptions and win.

main-branch main
docs docs/*
docs *.md
docs !CLAUDE.md
