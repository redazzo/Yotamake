# Runs the same gate as Claude's skills and the pre-commit hook.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # FILL IN: install the project's toolchain and dependencies here.
      - run: scripts/check --all
