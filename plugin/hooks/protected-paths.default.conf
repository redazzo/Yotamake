# Files Claude may not edit. One glob per line, matched against the file's
# basename and its full path. A glob with a / is also matched against the path
# from the project root, e.g. config/secrets/*. Lines starting with ! are
# exceptions and win.
# Read by the yotamake plugin's pre-edit-protect.sh hook.

.env
.env.*
!.env.example
!.env.sample
!.env.template
*.pem
*.key
*.p12
id_rsa*
allow-edits-on-main
