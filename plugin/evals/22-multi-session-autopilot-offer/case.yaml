expected_outcome: |
  The run plans a multi-session effort under .scratchpad/ and stops at the end of S0, though the user says they would rather not babysit the later sessions. The final message gives the resume line and offers autopilot. Nothing runs on autopilot until the user chooses it: no session agent, no source or test edits, no commit.
